name: "Tests"

on: [pull_request]

jobs:
  tests:
    name: "PHP ${{ matrix.php-versions }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Add a PHP version here and nowhere else — the image is built from one
        # parameterized Dockerfile.
        php-versions: ['8.5']

    env:
      PHP_VERSION: ${{ matrix.php-versions }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build
        run: |
          docker compose build
          docker compose up -d

      - name: Unit tests
        run: docker compose exec -T tests vendor/bin/phpunit --testsuite unit

      - name: E2E tests
        run: docker compose exec -T tests vendor/bin/phpunit --testsuite e2e
